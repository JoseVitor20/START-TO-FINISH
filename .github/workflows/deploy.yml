name: Deploy Laravel sem /public via FTP

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    name: Deploy Laravel
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Obter código mais recente
        uses: actions/checkout@v3

      - name: 📦 Instalar dependências do Composer
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 🔑 Gerar key do Laravel
        run: cp .env.example .env && php artisan key:generate

      - name: 📝 Copiar e ajustar index.php e .htaccess
        run: |
          cp public/index.php index.php
          cp public/.htaccess .htaccess
          sed -i 's|../vendor|vendor|g' index.php
          sed -i 's|../bootstrap|bootstrap|g' index.php

      - name: 🚀 Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./ # Diretório do Laravel com index.php e .htaccess ajustados
          exclude: |
            **/.git*
            **/node_modules/**
            **/tests/**
            **/vendor/**
            **/storage/**
            **/.github/**
            .env.example
            phpunit.xml
            README.md

      - name: 🚀 Configurar servidor via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            cd ${{ secrets.SERVER_DIR }}
            echo "📦 Instalando dependências no servidor..."
            composer install --no-dev --optimize-autoloader
            echo "🔄 Limpando caches..."
            php artisan config:clear
            php artisan cache:clear
            php artisan route:clear
            php artisan view:clear
            echo "🛠️ Corrigindo permissões..."
            chmod -R 775 storage bootstrap/cache
            chown -R www-data:www-data storage bootstrap/cache
            echo "✅ Deploy finalizado com sucesso!"
          EOF
