name: Deploy Laravel para public_html simulando public como raiz

on:
  push:
    branches:
      - develop

jobs:
  test:
    name: Executar Testes de Back-end
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Obter código mais recente
        uses: actions/checkout@v3

      - name: 📦 Instalar dependências do Composer
        run: composer install --prefer-dist --no-interaction --no-scripts

      - name: 🛠️ Configurar ambiente de teste
        run: cp .env.example .env && php artisan key:generate

      - name: 📦 Instalar PHPUnit
        run: composer require --dev phpunit/phpunit

      - name: 🧪 Rodar testes
        run: ./vendor/bin/phpunit

  deploy:
    name: Deploy Laravel via FTP simulando public como raiz
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Obter código mais recente
        uses: actions/checkout@v3

      - name: 🧹 Limpar cache do runner
        run: rm -rf ~/.cache ~/.ssh deploy

      - name: 📂 Preparar estrutura para deploy simulando public como raiz
        run: |
          mkdir deploy
          # Copiar todos os arquivos (inclusive ocultos) para deploy/
          cp -r . deploy/
          # Mover o conteúdo da pasta public para a raiz de deploy/
          mv deploy/public/* deploy/
          mv deploy/public/.[!.]* deploy/ 2>/dev/null || true
          rm -rf deploy/public
          # Ajustar os caminhos no index.php da raiz deploy/
          sed -i "s|__DIR__.'/../vendor/autoload.php'|__DIR__.'/vendor/autoload.php'|" deploy/index.php
          sed -i "s|__DIR__.'/../bootstrap/app.php'|__DIR__.'/bootstrap/app.php'|" deploy/index.php
          # Garantir que o .htaccess existe na raiz deploy/
          if [ ! -f deploy/.htaccess ]; then
            echo "<IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^ index.php [L]
            </IfModule>" > deploy/.htaccess
          fi

      - name: 📂 Enviar arquivos via FTP simulando public como raiz
        uses: SamKirkland/FTP-Deploy-Action@4.3.0
        with:
          server: ${{secrets.FTP_SERVER}}
          username: ${{secrets.FTP_USER}}
          password: ${{secrets.FTP_PASSWORD}}
          local-dir: ./deploy
          exclude: ""

      - name: 🚀 Executar comandos no servidor via SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H nexocode.com.br >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/id_rsa ${{secrets.SSH_USER}}@${{secrets.SSH_SERVER}} << 'EOF'
          cd ${{secrets.SERVER_DIR}}
          echo "📦 Instalando dependências..."
          composer install --no-dev --optimize-autoloader
          echo "🔄 Configurando ambiente..."
          mkdir -p storage bootstrap/cache
          php artisan storage:link
          php artisan config:clear
          php artisan cache:clear
          php artisan route:clear
          php artisan view:clear
          echo "🛠️ Aplicando permissões..."
          chmod -R 775 storage bootstrap/cache public/
          chown -R www-data:www-data storage bootstrap/cache public/
          echo "🗄️ Migrando banco de dados..."
          php artisan migrate --force
          echo "✅ Deploy efetuado com sucesso!"
          EOF
